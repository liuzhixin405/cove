name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # A UTF-8 BOM on line 1 of a .go file makes `go test -cover` fail to
      # build, because the cover tool rewrites line 1 and leaves the BOM
      # stranded mid-file ("invalid BOM in the middle of the file"). Five
      # files carried one, which is why coverage for internal/engine could
      # never be produced. Guard against reintroducing it.
      - name: Check for UTF-8 BOM in Go sources
        shell: bash
        run: |
          bad=$(git ls-files '*.go' | while read -r f; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then echo "$f"; fi
          done)
          if [ -n "$bad" ]; then
            echo "::error::UTF-8 BOM found - it breaks 'go test -cover':"
            echo "$bad"
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          RACE=""
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            RACE="-race"
          fi
          go test ${RACE} -coverprofile=coverage.txt ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
          flags: unittests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Pinned: "latest" let a new golangci-lint release (new default rules,
      # config schema changes) turn a green build red without a code change.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          args: --timeout=5m

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build -o cove ./cli/cove

      # The headless-Chrome backend is behind a build tag; keep it compiling
      # and its request-interception test running (no Chrome needed).
      - name: Vet and test with -tags chromedp
        run: |
          go vet -tags chromedp ./internal/browser/
          go test -tags chromedp -run 'PausedRequest|ShouldBlock' ./internal/browser/

      - name: Verify version
        shell: bash
        run: |
          want=$(sed -n 's/^[[:space:]]*Version = "\(.*\)"/\1/p' cli/cove/main.go)
          ./cove --version
          ./cove --version | grep -F "cove ${want} "
