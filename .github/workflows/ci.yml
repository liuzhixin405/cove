name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # A UTF-8 BOM on line 1 of a .go file makes `go test -cover` fail to
      # build, because the cover tool rewrites line 1 and leaves the BOM
      # stranded mid-file ("invalid BOM in the middle of the file"). Five
      # files carried one, which is why coverage for internal/engine could
      # never be produced. Guard against reintroducing it.
      - name: Check for UTF-8 BOM in Go sources
        shell: bash
        run: |
          bad=$(git ls-files '*.go' | while read -r f; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then echo "$f"; fi
          done)
          if [ -n "$bad" ]; then
            echo "::error::UTF-8 BOM found - it breaks 'go test -cover':"
            echo "$bad"
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          RACE=""
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            RACE="-race"
          fi
          set -o pipefail
          go test -v ${RACE} -coverprofile=coverage.txt ./... 2>&1 | tee test-output.txt

      # TEMPORARY debug aid: mirrors the interesting parts of the test output
      # into check-run annotations, which are readable without access to the
      # job log page. Remove once CI is green.
      - name: Publish failure summary
        if: failure() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 - <<'PY'
          import re, sys
          try:
              data = open("test-output.txt", "r", errors="replace").read()
          except OSError:
              print("::error::no test-output.txt captured")
              sys.exit(0)
          data = re.sub(r"\x1b\[[0-9;]*m", "", data)
          lines = data.splitlines()
          idx = set()
          for i, ln in enumerate(lines):
              if re.match(r"^\s*(--- FAIL|FAIL|WARNING: DATA RACE|panic:|fatal error:)", ln):
                  for j in range(max(0, i - 2), min(len(lines), i + 14)):
                      idx.add(j)
          keep = [lines[i] for i in sorted(idx)]
          summary = "\n".join(keep) if any(x.strip() for x in keep) else data[-6000:]
          summary = summary[:9000]
          print(f"::error::captured {len(summary)} bytes of failure detail")
          for k in range(0, len(summary), 700):
              chunk = summary[k:k+700].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error::part{k//700}: {chunk}")
          PY

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
          flags: unittests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m --output.text.path=lint.txt

      # TEMPORARY debug aid: see the test job's Publish failure summary step.
      - name: Publish lint summary
        if: failure()
        shell: bash
        run: |
          if [ ! -f lint.txt ]; then
            echo "::error::no lint.txt produced by golangci-lint"
            exit 0
          fi
          python3 - <<'PY'
          import re
          data = open("lint.txt", "r", errors="replace").read()
          data = re.sub(r"\x1b\[[0-9;]*m", "", data)
          keep = [ln for ln in data.splitlines() if re.match(r"^\S+\.go:\d+:\d+:", ln)]
          summary = "\n".join(keep)[:8000] or data[:8000]
          print(f"::error::lint findings: {len(keep)} lines")
          for k in range(0, len(summary), 700):
              chunk = summary[k:k+700].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error::lint{k//700}: {chunk}")
          PY

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build -o cove ./cli/cove

      - name: Verify version
        run: ./cove --version
