name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/create-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and upload binaries
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          # Binary name (matches the [[bin]]/src/main.rs target after rename)
          bin: cove
          token: ${{ secrets.GITHUB_TOKEN }}
